category: FINANCIAL
description: "금액/가격 파라미터 조작 페이로드"

# 이 파라미터명이 FINANCIAL로 분류되는 기준 (정규식 조각, "|"로 결합해서 사용).
# signature_classifier.py와 zap_scripts/parameter_diff_scan.js 양쪽이 이 목록을 그대로 읽는다.
field_name_patterns:
  - "price"
  - "amount"
  - "cost"
  - "total"
  - "fee"
  - "point"
  - "balance"
  - "pay"
  - "money"
  - "qty"
  - "quantity"
  - "discount"
  - "charge"

# {original_value * -1}, {original_value - 1}, {original_value + 1}은 실행 시점에
# 실제 원본 값을 기준으로 계산된다 (injector.py / parameter_diff_scan.js 양쪽에서 해석).
payloads:
  - "1"
  - "0"
  - "-1"
  - "-9999"
  - "0.001"
  - "99999999"
  - "NaN"
  - "null"
  - "{original_value * -1}"

mutation_strategies:
  - type: "replace"
  - type: "negate"
